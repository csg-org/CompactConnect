name: Check-Psypact-Application

on:
  pull_request:
    paths:
      - backend/psypact-app/**

env:
  AWS_REGION : "us-east-1"

# Permission can be added at job level or workflow level
permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout

jobs:
  LintPython:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v5

      - name: Upgrade pip
        # Runner image ships pip 25.3; Upgrade to 26.1+ to include fix for CVE-2026-3219.
        # Held below 26.2, which drops pip._internal.utils.compat.stdlib_pkgs and breaks pip-sync.
        run: pip install --upgrade 'pip>=26.1,<26.2'

      - name: Install dev dependencies
        run: "pip install -r backend/psypact-app/requirements-dev.txt"

      - name: Lint Code
        run: "cd backend/psypact-app; ruff check $(git ls-files '*.py')"

      - name: Check Dependencies
        run: "pip-audit"

  LintNode:
    runs-on: ubuntu-latest

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v5

      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."
      - run: echo "🖥️ The workflow is now ready to test your code on the runner."

      # Setup Node
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.11.1'

      # Use any cached yarn dependencies (saves build time)
      - uses: actions/cache@v4
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}

      # Install Yarn Dependencies
      - name: Install Node.js dependencies
        run: yarn install
        working-directory: ./backend/psypact-app/lambdas/nodejs

      # Run Linter Checks
      - name: Run linter
        run: yarn run lint
        working-directory: ./backend/psypact-app/lambdas/nodejs

      # Audit dependencies for vulnerabilities
      - name: Audit dependencies
        run: yarn run audit:dependencies
        working-directory: ./backend/psypact-app/lambdas/nodejs

  TestApp:
    runs-on: ubuntu-latest
    steps:
      # Checks-out the repository under $GITHUB_WORKSPACE
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Upgrade pip
        # Runner image ships pip 25.3; Upgrade to 26.1+ to include fix for CVE-2026-3219.
        # Held below 26.2, which drops pip._internal.utils.compat.stdlib_pkgs and breaks pip-sync.
        run: pip install --upgrade 'pip>=26.1,<26.2'

      # Setup Node
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.11.1'

      # Use any cached yarn dependencies (saves build time)
      - uses: actions/cache@v4
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}

      # Install Yarn Dependencies
      - name: Install Node.js dependencies
        run: yarn install
        working-directory: ./backend/psypact-app/lambdas/nodejs

      - name: Install dev dependencies
        run: "pip install -r backend/psypact-app/requirements-dev.txt"

      - name: Install all Python dependencies
        run: "cd backend/psypact-app; bin/sync_deps.sh"

      - name: Test backend
        run: "cd backend/psypact-app; bin/run_tests.sh -l all -no"

  # The purchases lambda Python version has to be held back because of its Authorize.net dependency
  # so we will check it separately
  TestAndLintPurchases:
    runs-on: ubuntu-latest
    steps:
      # Checks-out the repository under $GITHUB_WORKSPACE
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Upgrade pip
        # Runner image ships pip 25.3; Upgrade to 26.1+ to include fix for CVE-2026-3219.
        # Held below 26.2, which drops pip._internal.utils.compat.stdlib_pkgs and breaks pip-sync.
        run: pip install --upgrade 'pip>=26.1,<26.2'

      - name: Install dependencies
        run: "cd backend/psypact-app/lambdas/python/purchases; pip install -r requirements.txt"

      - name: Install dev dependencies
        run: "cd backend/psypact-app/lambdas/python/purchases; pip install -r requirements-dev.txt"

      - name: Lint Code
        run: "cd backend/psypact-app/lambdas/python/purchases; ruff check $(git ls-files '*.py')"

      - name: Check Dependencies
        # Ignore known pip and lxml advisories currently accepted for this repo.
        run: "pip-audit --ignore-vuln GHSA-4xh5-x5gv-qwph --ignore-vuln CVE-2026-41066"

      - name: Test backend
        run: "cd backend/psypact-app/lambdas/python/purchases; PYTHONPATH=../common pytest tests --cov --cov-fail-under=90"
