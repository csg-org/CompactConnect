[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "common-lambdas"
version = "0.1.0"
description = "Shared Compact Connect schemas consumed by individual compact apps"
requires-python = ">=3.12"
dependencies = [
    "marshmallow>=4.3.0,<5.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["common_lambdas*"]
